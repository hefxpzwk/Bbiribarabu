name: build-bbiribarabu

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build Linux release binary
        run: cargo build --release

      - name: Rename Linux binary
        run: |
          mv target/release/Bbiribarabu bbiribarabu-linux

      - name: Upload Linux binary to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: bbiribarabu-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS binary
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS release binary
        run: |
          MACOSX_DEPLOYMENT_TARGET=13.0 cargo build --release

      - name: Rename macOS binary
        run: |
          mv target/release/Bbiribarabu bbiribarabu-macos

      - name: Upload macOS binary to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: bbiribarabu-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
